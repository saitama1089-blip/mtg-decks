[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "duel-commander-data"
version = "0.2.0"
description = "Independent Duel Commander tournament database and import tools"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "ijson>=3.3,<4", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
dc-data = "dc_importer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an empty disposable PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

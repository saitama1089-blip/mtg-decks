name: Apply database migrations
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duel-commander-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: djayrdiyastspmoaqkml
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_MIGRATION_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m dc_importer migrate
